name: relay-analytics

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: relay
      DATABASE_PASSWORD: relay
      DATABASE_NAME: relay
    # AC-2.5: migrate and seed run against the compose `db` before the API
    # starts. Both are idempotent, so this is safe on every boot.
    command:
      [
        "sh",
        "-c",
        "npm run migration:run && npm run seed && node dist/main.js",
      ]
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db-data: