name: relay-analytics

# Every setting below has a default (`VAR:-value`), so `docker compose up`
# works on a fresh clone with no .env file. See .env.example for the full set.

services:
  db:
    image: postgres:14
    environment:
      # The API reads the same DATABASE_* names, so the app can never end up
      # pointed at a different database than the one created here.
      POSTGRES_USER: ${DATABASE_USER:-relay}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-relay}
      POSTGRES_DB: ${DATABASE_NAME:-relay}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER:-relay} -d ${DATABASE_NAME:-relay}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      # `db` is the Compose service name, regardless of DATABASE_HOST, which
      # describes the database as seen from your machine.
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-relay}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-relay}
      DATABASE_NAME: ${DATABASE_NAME:-relay}
    # AC-2.5: migrate and seed run against the compose `db` before the API
    # starts. Both are idempotent, so this is safe on every boot.
    command:
      [
        "sh",
        "-c",
        "npm run migration:run && npm run seed && node dist/main.js",
      ]
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  db-data: